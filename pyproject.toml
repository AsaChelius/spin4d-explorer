[project]
name = "spin4d-explorer"
version = "0.1.0"
description = "Stream and explore the SPIn4D solar magnetism dataset without local downloads"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.5",
    "fsspec[http]>=2026.4.0",
    "h5py>=3.16.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "tqdm>=4.67.3",
]

[project.scripts]
spin4d-explorer = "spin4d_explorer:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"
